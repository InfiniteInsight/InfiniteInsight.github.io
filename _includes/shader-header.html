<style>
.page-header {
  position: relative !important;
  padding: 0 !important;
  background: #000 !important;
  background-image: none !important;
  min-height: 340px;
  display: flex !important;
  align-items: center;
  justify-content: center;
}
#shader-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.shader-card {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 2.5rem 3rem;
  border-radius: 1.25rem;
  background: rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  max-width: 680px;
  margin: 2.5rem 1.5rem;
}
.shader-card .project-name {
  color: #fff;
  font-size: 2rem;
  margin-bottom: 0.5rem;
}
.shader-card .project-tagline {
  color: rgba(255, 255, 255, 0.82);
  font-size: 1rem;
  margin-bottom: 1.5rem;
}
.shader-card .project-name,
.shader-card .project-tagline {
  font-family: Consolas, 'Cascadia Code', 'Liberation Mono', Menlo, monospace;
}
.shader-card .btn {
  font-family: Consolas, 'Cascadia Code', 'Liberation Mono', Menlo, monospace;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: background 0.2s, border-color 0.2s;
}
.shader-card .btn:hover {
  background: rgba(255, 255, 255, 0.28);
  border-color: rgba(255, 255, 255, 0.6);
  text-decoration: none;
}
</style>

<header class="page-header" role="banner">
  <canvas id="shader-canvas"></canvas>
  <div class="shader-card">
    <h1 class="project-name">www.NevermoreLab.com</h1>
    <h2 class="project-tagline">{{ page.description | default: site.description | default: site.github.project_tagline }}</h2>
    <a href="https://www.nevermorelab.com/assets/docs/EvanNevermore-Resume.pdf" class="btn" target="_blank" rel="noopener noreferrer">View Resume</a>
    <a href="https://github.com/InfiniteInsight" class="btn">GitHub Account</a>
  </div>
</header>

<script>
(function () {
  var canvas = document.getElementById('shader-canvas');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;

  function resize() {
    var h = canvas.parentElement;
    canvas.width  = h.offsetWidth  || window.innerWidth;
    canvas.height = h.offsetHeight || 340;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);

  var vert = [
    'attribute vec4 aPos;',
    'void main(){gl_Position=aPos;}'
  ].join('\n');

  var frag = [
    'precision highp float;',
    'uniform vec2 iRes;',
    'uniform float iTime;',

    'vec3 spec(float l){',
    '  float r=0.0,g=0.0,b=0.0;',
    '  if(l>=400.0&&l<410.0){float t=(l-400.0)/10.0;r=0.33*t-0.20*t*t;}',
    '  else if(l>=410.0&&l<475.0){float t=(l-410.0)/65.0;r=0.14-0.13*t*t;}',
    '  else if(l>=545.0&&l<595.0){float t=(l-545.0)/50.0;r=1.98*t-t*t;}',
    '  else if(l>=595.0&&l<650.0){float t=(l-595.0)/55.0;r=0.98+0.06*t-0.40*t*t;}',
    '  else if(l>=650.0&&l<700.0){float t=(l-650.0)/50.0;r=0.65-0.84*t+0.20*t*t;}',
    '  if(l>=415.0&&l<475.0){float t=(l-415.0)/60.0;g=0.80*t*t;}',
    '  else if(l>=475.0&&l<590.0){float t=(l-475.0)/115.0;g=0.8+0.76*t-0.80*t*t;}',
    '  else if(l>=585.0&&l<639.0){float t=(l-585.0)/54.0;g=0.82-0.80*t;}',
    '  if(l>=400.0&&l<475.0){float t=(l-400.0)/75.0;b=2.20*t-1.50*t*t;}',
    '  else if(l>=475.0&&l<560.0){float t=(l-475.0)/85.0;b=0.7-t+0.30*t*t;}',
    '  return vec3(r,g,b);',
    '}',

    'void main(){',
    '  vec2 p=(2.0*gl_FragCoord.xy-iRes)/min(iRes.x,iRes.y)*2.0;',
    '  for(int i=0;i<8;i++){',
    '    vec2 q=vec2(',
    '      p.y+cos(p.x+iTime)-sin(p.y*cos(iTime*0.2)),',
    '      p.x-sin(p.y-iTime)-cos(p.x*sin(iTime*0.3))',
    '    );',
    '    p=q;',
    '  }',
    '  gl_FragColor=vec4(spec(p.y*50.0+500.0+sin(iTime*0.6)),1.0);',
    '}'
  ].join('\n');

  function mkShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, 'iTime');
  var uRes  = gl.getUniformLocation(prog, 'iRes');

  resize();

  var t0 = Date.now();
  (function render() {
    gl.uniform1f(uTime, (Date.now() - t0) / 1000);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  })();
})();
</script>
